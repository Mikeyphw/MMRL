name: MMRL Next - Android source build (no release)

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Compile rebuilt MMRL debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Assemble official debug APK only
        run: ./gradlew --no-daemon --stacktrace :app:assembleOfficialDebug
      - name: Upload debug APK (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: mmrl-next-official-debug-${{ github.run_id }}
          path: app/build/outputs/apk/official/debug/*.apk
          if-no-files-found: error
          retention-days: 7
