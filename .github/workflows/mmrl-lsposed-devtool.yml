name: MMRL LSPosed upstream Devtool baseline

on:
  push:
    branches:
      - lsposed-vector
  pull_request:
    branches:
      - lsposed-vector

permissions:
  contents: read
  packages: read

concurrency:
  group: mmrl-lsposed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-dag:
    name: Hosted Devtool native OfficialDebug DAG
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DEVTOOL_SOURCE_SHA: 246f168ebdef6d9b25c194268c810c877d099fa3
      ORG_GRADLE_PROJECT_mmrlLsposedHosted: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
      # Original upstream settings.gradle.kts may read private GitHub Packages.
      ACTOR: ${{ github.actor }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5; Node 24
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6; Node 24
        with:
          python-version: '3.12'

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5; Node 24
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up reviewed Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install NDK and CMake for upstream native modules
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;29.0.14206865' 'cmake;3.22.1'

      - name: Review Gradle wrapper and enable dependency cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2; Node 24
        with:
          validate-wrappers: true

      - name: Install pinned Devtool into isolated venv
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"

      - name: Test the source-controlled lint regression gate (offline)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_mmrl_lsposed_lint_gate.py
          python3 scripts/test_mmrl_lsposed_phase02_contract.py
          python3 scripts/test_mmrl_lsposed_phase03_contract.py
          python3 scripts/test_mmrl_lsposed_device_contract.py

      - name: Compile and check immutable native DAG plan
        id: dag_plan
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/mmrl_lsposed_hosted.py plan \
            --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/mmrl-lsposed/plan.json"

      - name: Execute APK node through Devtool DAG
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/mmrl_lsposed_hosted.py run --node apk \
            --root "$GITHUB_WORKSPACE" \
            --inputs "$RUNNER_TEMP/mmrl-lsposed-inputs" \
            --outputs "$RUNNER_TEMP/mmrl-lsposed-outputs"

      - name: Verify APK signature package and source-bound native receipt
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/mmrl_lsposed_hosted.py verify \
            --root "$GITHUB_WORKSPACE" \
            --inputs "$RUNNER_TEMP/mmrl-lsposed-inputs" \
            --outputs "$RUNNER_TEMP/mmrl-lsposed-outputs" \
            --evidence "$RUNNER_TEMP/mmrl-lsposed/verification.json"

      - name: Upload exact debug APK and Devtool DAG receipts
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        with:
          name: mmrl-lsposed-officialdebug-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmrl-lsposed-outputs/node-01/
          if-no-files-found: error
          retention-days: 14

      # Lint is a distinct native DAG node and never blocks APK construction.
      # Existing diagnostics require a source-controlled reviewed baseline;
      # the first run intentionally fails that gate while publishing a candidate.
      - name: Run Android lint through the independent Devtool DAG node
        id: lint_dag
        if: always() && steps.dag_plan.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/mmrl_lsposed_hosted.py run --node lint \
            --root "$GITHUB_WORKSPACE" \
            --inputs "$RUNNER_TEMP/mmrl-lsposed-inputs" \
            --outputs "$RUNNER_TEMP/mmrl-lsposed-outputs"

      - name: Evaluate source-controlled lint baseline
        if: always()
        shell: bash
        env:
          MMRL_LINT_DAG_OUTCOME: ${{ steps.lint_dag.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/mmrl_lsposed_lint_gate.py gate \
            --root "$GITHUB_WORKSPACE" \
            --report app/build/reports/lint-results-officialDebug.xml \
            --baseline ci/mmrl-lsposed-lint-baseline.json \
            --candidate "$RUNNER_TEMP/mmrl-lsposed/lint-candidate.json" \
            --evidence "$RUNNER_TEMP/mmrl-lsposed/lint-gate.json"

      - name: Upload full Android Lint reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        with:
          name: mmrl-lsposed-lint-reports-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-officialDebug.*
            platform/build/reports/lint-results-*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload plan and verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        with:
          name: mmrl-lsposed-ci-evidence-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmrl-lsposed/
          if-no-files-found: warn
          retention-days: 14

      # A real device is required to execute these tests. Building the AndroidTest
      # APK in the SAME job preserves the main APK signing certificate.
      # This task must never be treated as on-device acceptance.
      - name: Build paired Android instrumentation APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleOfficialDebugAndroidTest
          python3 scripts/mmrl_lsposed_device_pair.py \
            --main-apk "$RUNNER_TEMP/mmrl-lsposed-outputs/node-01/payload/app/build/outputs/apk/official/debug/MMRL-LSPosed-CI-OfficialDebug.apk" \
            --tests-directory app/build/outputs/apk/androidTest/official/debug \
            --out "$RUNNER_TEMP/mmrl-lsposed-device-pair"

      - name: Upload signed instrumentation APK and pair receipt
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6; Node 24
        with:
          name: mmrl-lsposed-device-test-apk-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmrl-lsposed-device-pair/
          if-no-files-found: error
          retention-days: 14
