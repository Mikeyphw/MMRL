name: MMRL release seal

on:
  pull_request:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmrl-release-seal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: ${{ matrix.task-set }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        task-set: [debug, release, static]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Source hygiene
        run: python3 scripts/validate-mmrl-source-hygiene.py

      # Release validation must exercise the app's strict signing path without
      # depending on production secrets. This ephemeral key exists only for CI build validation
      # and is never uploaded or used by a published artifact.
      - name: Prepare ephemeral CI validation signing
        if: matrix.task-set == 'release'
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mmrl-ci-validation.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass mmrl-ci-validation \
            -keypass mmrl-ci-validation \
            -alias mmrl-ci-validation \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=MMRL CI Validation,O=MMRL,C=US"
          cat > signing.properties <<EOF
          keyStore=$KEYSTORE
          keyStorePassword=mmrl-ci-validation
          keyAlias=mmrl-ci-validation
          keyPassword=mmrl-ci-validation
          EOF

      - name: Toolchain and product boundary gates
        if: matrix.task-set == 'static'
        run: ./gradlew verifyStableToolchainBaseline verifyMmrlProductBoundary verifyRepositoryHygiene --console=plain

      - name: Platform JVM and native contract tests
        if: matrix.task-set == 'static'
        run: ./gradlew :platform:testDebugUnitTest :platform:testNativeContracts --build-cache --console=plain

      # Keep both fatal checks independent so failing tests never hide Lint findings.
      - name: Official debug unit tests
        if: matrix.task-set == 'debug'
        run: ./gradlew :app:testOfficialDebugUnitTest --build-cache --console=plain

      - name: Official debug strict lint
        if: ${{ !cancelled() && matrix.task-set == 'debug' }}
        run: ./gradlew :app:lintOfficialDebug -Pmmrl.fullLint=true --build-cache --console=plain

      # Always preserve the full strict Lint report, including findings from
      # dependency modules. The Gradle console only prints its first failure.
      - name: Print complete OfficialDebug Lint findings
        if: ${{ always() && matrix.task-set == 'debug' }}
        shell: bash
        run: |
          report="app/build/intermediates/lint_intermediate_text_report/officialDebug/lintReportOfficialDebug/lint-results-officialDebug.txt"
          if [[ -f "$report" ]]; then
            echo '=== Full OfficialDebug Lint report ==='
            cat "$report"
          else
            echo 'Lint text report not generated (the build may have failed before Lint).'
          fi

      - name: Preserve strict Lint and unit-test reports
        if: ${{ always() && matrix.task-set == 'debug' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmrl-strict-lint-${{ github.run_id }}-attempt${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/intermediates/lint_intermediate_text_report/
            app/build/reports/lint-results-*
            app/build/reports/tests/testOfficialDebugUnitTest/
            app/build/test-results/testOfficialDebugUnitTest/

      - name: Assemble official debug
        if: matrix.task-set == 'debug'
        run: ./gradlew :app:assembleOfficialDebug --build-cache --console=plain

      - name: Assemble official release
        if: matrix.task-set == 'release'
        run: ./gradlew :app:assembleOfficialRelease --build-cache --console=plain


  instrumentation-contracts:
    name: Instrumentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Compile instrumentation tests
        run: ./gradlew :app:compileOfficialDebugSources :app:processOfficialDebugResources :app:compileOfficialDebugAndroidTestKotlin --build-cache --console=plain
