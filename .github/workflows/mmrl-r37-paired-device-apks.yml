name: MMRL R37 paired OfficialDebug device artifacts (non-release)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mmrl-r37-pair-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      DEVTOOL_SOURCE_SHA: 246f168ebdef6d9b25c194268c810c877d099fa3
      ORG_GRADLE_PROJECT_mmrlR36HostedDebug: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: 15859902
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;29.0.14206865' 'cmake;3.22.1'
          test -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties"
      - name: Reviewed Gradle runner
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Install pinned Devtool provider
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate-mmrl-source-hygiene.py
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach "$DEVTOOL_SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = "$DEVTOOL_SOURCE_SHA"
          python3 -m venv "$RUNNER_TEMP/devtool-venv"
          "$RUNNER_TEMP/devtool-venv/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP/devtool-source"
      - name: Build and verify app via existing R36 native DAG provider
        shell: bash
        run: |
          set -euo pipefail
          DTPY="$RUNNER_TEMP/devtool-venv/bin/python"
          "$DTPY" scripts/mmrl_r36_hosted.py plan --root "$GITHUB_WORKSPACE" --evidence "$RUNNER_TEMP/mmrl-r36/plan.json"
          "$DTPY" scripts/mmrl_r36_hosted.py run --root "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/rm06-inputs" --outputs "$RUNNER_TEMP/rm06-output"
          "$DTPY" scripts/mmrl_r36_hosted.py verify --root "$GITHUB_WORKSPACE" --inputs "$RUNNER_TEMP/rm06-inputs" --outputs "$RUNNER_TEMP/rm06-output" --evidence "$RUNNER_TEMP/mmrl-r36/verification.json"
      - name: Assemble matching instrumentation APK on GitHub only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          ./gradlew :app:assembleOfficialDebugAndroidTest --build-cache --console=plain
          TEST_DIR=app/build/outputs/apk/androidTest/official/debug
          test -d "$TEST_DIR"
          mapfile -d '' APKS < <(find "$TEST_DIR" -maxdepth 1 -type f -name '*.apk' -print0)
          test "${#APKS[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/mmrl-r37-test/payload"
          cp -- "${APKS[0]}" "$RUNNER_TEMP/mmrl-r37-test/payload/MMRL-R37-OfficialDebug-androidTest.apk"
      - name: Independently check both APKs and emit source-bound pair receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mmrl-r37-evidence"
          "$RUNNER_TEMP/devtool-venv/bin/python" scripts/mmrl_r37_pair.py \
            --app "$RUNNER_TEMP/rm06-output/node-01/payload/app/build/outputs/apk/official/debug/MMRL-R36-OfficialDebug.apk" \
            --test "$RUNNER_TEMP/mmrl-r37-test/payload/MMRL-R37-OfficialDebug-androidTest.apk" \
            --r36-plan "$RUNNER_TEMP/mmrl-r36/plan.json" \
            --r36-verification "$RUNNER_TEMP/mmrl-r36/verification.json" \
            --r36-native-receipt "$RUNNER_TEMP/rm06-output/node-01/receipt.json" \
            --output "$RUNNER_TEMP/mmrl-r37-evidence/pair.json"
          cp "$RUNNER_TEMP/mmrl-r36/plan.json" "$RUNNER_TEMP/mmrl-r37-evidence/r36-plan.json"
          cp "$RUNNER_TEMP/mmrl-r36/verification.json" "$RUNNER_TEMP/mmrl-r37-evidence/r36-verification.json"
          cp "$RUNNER_TEMP/rm06-output/node-01/receipt.json" "$RUNNER_TEMP/mmrl-r37-evidence/r36-native-receipt.json"
      - name: Upload R36 native app APK and its original handoff
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmrl-r37-paired-app-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/rm06-output/node-01/
          if-no-files-found: error
          retention-days: 7
      - name: Upload matching AndroidTest APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmrl-r37-paired-test-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmrl-r37-test/
          if-no-files-found: error
          retention-days: 7
      - name: Upload checked pair provenance (not device acceptance)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmrl-r37-paired-evidence-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/mmrl-r37-evidence/
          if-no-files-found: error
          retention-days: 7
