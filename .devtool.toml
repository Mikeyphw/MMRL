# LSPosed/Vector clean-upstream hosted CI baseline (Phase 01).
# Runtime and Gradle tasks are executed only through Devtool's reviewed
# GitHub-hosted Android semantic DAG, never through workflow shell Gradle calls.
[project]
runner = "android"
platform = "android"

[targets.mmrl_lsposed_ci]
root = "."
runner = "android"
platform = "android"
execution_environment = "auto"

# Independent APK and lint jobs in one immutable Devtool native DAG.
# There is intentionally no dependency from APK on lint or vice versa.
[targets.mmrl_lsposed_ci.jobs.assemble_debug]
runner = "android"
gradle_tasks = [":app:assembleOfficialDebug"]
outputs = ["app/build/outputs/apk/official/debug/MMRL-LSPosed-CI-OfficialDebug.apk"]
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "officialDebug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd", ci_android_expected_output = "app/build/outputs/apk/official/debug/MMRL-LSPosed-CI-OfficialDebug.apk" }

[targets.mmrl_lsposed_ci.jobs.lint_debug]
runner = "android"
gradle_tasks = [":app:lintOfficialDebug"]
outputs = []
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "officialDebug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd" }

[targets.mmrl_lsposed_ci.workflows]
ci = ["job:assemble_debug", "job:lint_debug"]
