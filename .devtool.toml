[wrapper]
schema = 2
default_command = "build"

[wrapper.commands.build]
description = "Build the canonical MMRL Android target through Devtool"
devtool = "build"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.test]
description = "Run MMRL target tests through Devtool"
devtool = "test"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.lint]
description = "Run MMRL target lint through Devtool"
devtool = "lint"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.validate]
description = "Run Devtool validation for MMRL"
devtool = "validate"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.validate.options.task]
type = "string"
description = "Run an exact Gradle validation task"
repeatable = true
command_argv = ["--task", "{value}"]

[wrapper.commands.validate-session]
description = "Run MMRL through Devtool durable sequential validation checkpoints"
devtool = "validate"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.validate-session.options.sequential]
type = "boolean"
description = "Keep validation state durable across phase boundaries"
default = true
command_argv = ["--sequential"]

[wrapper.commands.validate-session.options.complete]
type = "boolean"
description = "Run every remaining validation phase"
command_argv = ["--complete"]

[wrapper.commands.validate-session.options.retry-failed]
type = "boolean"
description = "Retry the failed phase and its dependents after a repair"
command_argv = ["--retry-failed"]

[wrapper.commands.validate-session.options.max-runtime]
type = "string"
description = "Pause before the next phase when this runtime budget is reached"
command_argv = ["--max-runtime", "{value}"]

[wrapper.commands.validate-session.options.failure-action]
type = "choice"
description = "Preserve the tree and checkpoint state on validation failure"
choices = ["pause", "rollback", "keep", "prompt"]
default = "pause"
command_argv = ["--failure-action", "{value}"]

[wrapper.commands.clean]
description = "Clean MMRL through Devtool"
devtool = "clean"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.package]
description = "Package MMRL through Devtool"
devtool = "package"
target = "mmrl_android"
allow_passthrough = true

[wrapper.commands.repository-check]
description = "Run the repository-owned EXO validation DAG without shadowing native Devtool validation"
workflow = "repository-check"
target = "mmrl_android"

[wrapper.commands.release-check]
description = "Run the repository-owned pre-release validation DAG"
workflow = "release-check"
target = "mmrl_android"

[wrapper.commands.device]
description = "Run canonical Devtool Android instrumentation through the device workflow"
workflow = "device"
target = "mmrl_android"

[workspace]
default_target = "mmrl_android"

[targets.mmrl_android.jobs.ci-actions-contract]
runner = "command"
command = ["python3", "scripts/devtool_actions_contract.py"]
inputs = [".devtool.toml", ".github/workflows/*.yml", "scripts/devtool_actions_contract.py"]
metadata = { read_only = true }

[workspace.scheduler]
parallel = true
max_parallel_nodes = 2
max_gradle_nodes = 1
max_dotnet_nodes = 1

[wrapper.commands.ci-preflight]
description = "ci-preflight through canonical Devtool and EXO"
workflow = "ci-preflight"
target = "mmrl_android"

[wrapper.commands.ci-local]
description = "ci-local through canonical Devtool and EXO"
workflow = "repository-check"
target = "mmrl_android"

[targets.mmrl_android.jobs.ci-source-contract]
runner = "command"
command = ["python3", "scripts/verify-mmrl-github-actions.py", "--static"]
inputs = [".devtool.toml", "scripts/verify-mmrl-github-actions.py", ".github/workflows/*.yml"]
metadata = { read_only = true }

[wrapper.commands.ci-source]
description = "Read-only project-specific source and CI contract with EXO evidence"
workflow = "ci-source"
target = "mmrl_android"
