[project]
runner = "android"
platform = "android"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[targets.mmrl_android]
root = "."
execution_environment = "native-termux"
chroot_name = "androidos"
runner = "android"
platform = "android"

[targets.mmrl_android.android]
system_deps = "auto"
native_provider = "ndk"
ndk_version = "29.0.14206865"
ndk_host_provider = "auto"
cmake_version = "3.22.1"
variant = "officialDebug"
aapt2_provider = "termux"
instrumentation = "when-device-present"
prefer_native_termux = false

[targets.mmrl_android.gradle]
version = "9.7.1"
provider = "wrapper"
resource_profile = "constrained"
max_workers = 1
configuration_cache = "off"
telemetry_level = "standard"
no_daemon = true
vfs = false
parallel = false
build_cache = true
failure_policy = "collect"
daemon_idle_timeout_ms = 900000

[targets.mmrl_android.tasks]
restore = ["help"]
build = [":app:assembleOfficialDebug"]
test = [
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
]
lint = [":app:lintOfficialDebug"]
clean = ["clean"]

[targets.mmrl_android.artifacts]
required = true

# X01 establishes repository-owned EXO target-local jobs. Read-only contract
# checks explicitly say so; Gradle/device jobs declare bounded write scopes so
# the scheduler no longer has to treat every workflow node as an unknown writer.
[targets.mmrl_android.jobs.source-hygiene]
runner = "command"
command = ["python3", "scripts/validate-mmrl-source-hygiene.py"]
inputs = ["**/*"]
metadata = { read_only = true, resource_class = "generic-read-only", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.static-gates]
runner = "gradle"
gradle_tasks = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
]
inputs = [".devtool.toml", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**", "scripts/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.unit-contracts]
runner = "gradle"
gradle_tasks = [
  ":platform:testNativeContracts",
  ":platform:testDebugUnitTest",
  ":app:testOfficialDebugUnitTest",
]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.compile-contracts]
runner = "gradle"
gradle_tasks = [
  ":app:compileOfficialDebugSources",
  ":app:processOfficialDebugResources",
  ":app:compileOfficialDebugAndroidTestKotlin",
]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.strict-lint]
runner = "gradle"
gradle_tasks = [":app:fullLintOfficialDebug"]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.strict-lint.env]
"ORG_GRADLE_PROJECT_mmrl.fullLint" = "true"

[targets.mmrl_android.jobs.package-seal]
runner = "gradle"
gradle_tasks = [
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

# Temporary compatibility boundary. X02 replaces this shell/raw-Gradle fallback
# with Devtool's canonical ADB/instrumentation execution and evidence path.
[targets.mmrl_android.jobs.device-compat]
runner = "command"
command = ["scripts/run-mmrl-device-validation.sh"]
inputs = ["scripts/run-mmrl-device-validation.sh", "gradlew", "gradle/**", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "device-exclusive", global_reservations = ["mmrl-adb-device"], roadmap_id = "MMRL-DT-X01", compatibility_boundary = "devtool-adb-parser" }

[targets.mmrl_android.workflows]
validate = [
  { id = "source-hygiene", ref = "job:source-hygiene", depends_on = [] },
  { id = "static-gates", ref = "job:static-gates", depends_on = ["source-hygiene"] },
  { id = "unit-contracts", ref = "job:unit-contracts", depends_on = ["static-gates"] },
  { id = "compile-contracts", ref = "job:compile-contracts", depends_on = ["static-gates"] },
  { id = "strict-lint", ref = "job:strict-lint", depends_on = ["unit-contracts", "compile-contracts"] },
  { id = "package-seal", ref = "job:package-seal", depends_on = ["strict-lint"] },
]
device = [
  { id = "device-compat", ref = "job:device-compat", depends_on = [] },
]
release-seal = [
  { id = "source-hygiene", ref = "job:source-hygiene", depends_on = [] },
  { id = "static-gates", ref = "job:static-gates", depends_on = ["source-hygiene"] },
  { id = "unit-contracts", ref = "job:unit-contracts", depends_on = ["static-gates"] },
  { id = "compile-contracts", ref = "job:compile-contracts", depends_on = ["static-gates"] },
  { id = "strict-lint", ref = "job:strict-lint", depends_on = ["unit-contracts", "compile-contracts"] },
  { id = "package-seal", ref = "job:package-seal", depends_on = ["strict-lint"] },
  { id = "device-compat", ref = "job:device-compat", depends_on = ["package-seal"] },
]

[validation.phases]
preflight = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
  "help",
]
compile = [
  ":app:compileOfficialDebugSources",
  ":app:compileOfficialDebugAndroidTestKotlin",
]
resources = [":app:processOfficialDebugResources"]
unit-test = [
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
]
package = [
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
lint = [":app:fullLintOfficialDebug"]

[validation.final]
release-seal = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
  ":app:fullLintOfficialDebug",
  ":app:compileOfficialDebugAndroidTestKotlin",
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
native = [":platform:testDebugUnitTest", ":platform:testNativeContracts"]

