# N03: native, GitHub-hosted Devtool Android integration for MMRL `next`.
# A separate Android manager owns its own target; never run Gradle in Termux.
[project]
runner = "android"
platform = "android"

[workspace]
default_target = "mmrl_next"

[targets.mmrl_next]
root = "."
runner = "android"
platform = "android"
execution_environment = "auto"

[targets.mmrl_next.jobs.assemble_debug]
runner = "android"
gradle_tasks = [":app:assembleOfficialDebug"]
outputs = ["app/build/outputs/apk/official/debug/MMRL-Next-CI-OfficialDebug.apk"]
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "officialDebug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd", ci_android_expected_output = "app/build/outputs/apk/official/debug/MMRL-Next-CI-OfficialDebug.apk" }

[targets.mmrl_next.jobs.lint_debug]
runner = "android"
gradle_tasks = [":app:lintOfficialDebug"]
outputs = []
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "officialDebug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd" }

[targets.mmrl_next.jobs.unit_debug]
runner = "android"
gradle_tasks = [":app:testOfficialDebugUnitTest"]
outputs = []
metadata = { ci_toolchain = "android-gradle", ci_android_java_version = "21", ci_android_project_dir = "", ci_android_debug_variant = "officialDebug", ci_android_sdk_packages = ["platforms;android-36", "build-tools;36.0.0", "platform-tools"], ci_android_wrapper_jar_sha256 = "d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd" }

[targets.mmrl_next.workflows]
ci = [
  { id = "apk", ref = "job:assemble_debug", depends_on = [] },
  { id = "lint", ref = "job:lint_debug", depends_on = [] },
  { id = "test", ref = "job:unit_debug", depends_on = [] },
]
