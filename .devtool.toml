[project]
kind = "android"
default_target = "mmrl_android"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[targets.mmrl_android]
type = "android"
root = "."
execution_environment = "native-termux"
chroot_name = "androidos"

[targets.mmrl_android.android]
system_deps = "auto"
native_provider = "ndk"
ndk_host_provider = "auto"
cmake_version = "3.22.1"
variant = "officialDebug"
aapt2_provider = "termux"
instrumentation = "never"
prefer_native_termux = false

[targets.mmrl_android.gradle]
version = "9.7.1"
provider = "wrapper"
max_workers = 1
structured_events = false
no_daemon = true
daemon_idle_timeout_ms = 900000
parallel = false
build_cache = true
fail_fast = true
offline = false
args = [
  "-Dorg.gradle.parallel=false",
  "-Dorg.gradle.vfs.watch=false",
  "-Pkotlin.incremental=true",
  "-Pkotlin.compiler.execution.strategy=in-process",
]

[targets.mmrl_android.tasks]
restore = ["help"]
build = [":app:assembleOfficialDebug"]
test = [
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
]
lint = [":app:lintOfficialDebug"]
clean = ["clean"]

[targets.mmrl_android.artifacts]
required = true

[validation.phases]
preflight = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "help",
]
compile = [
  ":app:compileOfficialDebugSources",
  ":app:compileOfficialDebugAndroidTestKotlin",
]
resources = [":app:processOfficialDebugResources"]
unit-test = [
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
]
package = [
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
lint = [":app:fullLintOfficialDebug"]

[validation.final]
release-seal = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
  ":app:fullLintOfficialDebug",
  ":app:compileOfficialDebugAndroidTestKotlin",
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
native = [":platform:testDebugUnitTest", ":platform:testNativeContracts"]

[validation]
android_safe = false
max_workers = 1
cpu_limit = 1
parallel = false
split_gradle = true
no_daemon = true
stop_daemon_after_phase = true
low_priority = true
gradle_heap_mb = 1024
gradle_metaspace_mb = 384
gradle_packaging_metaspace_mb = 384
gradle_lint_metaspace_mb = 384
memory_guard_mb = 0
affected_module_lint = true

[validation.phase_profiles.preflight]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 640
gradle_metaspace_mb = 320
memory_guard_mb = 0
no_daemon = true
low_priority = true

[validation.phase_profiles.compile]
max_workers = 1
cpu_limit = 1
gradle_heap_mb = 1024
gradle_metaspace_mb = 384
memory_guard_mb = 0
