[project]
runner = "android"
platform = "android"

[execution]
environment = "auto"
chroot_name = "androidos"
device_serial = ""

[toolchain]
# MMRL does not require mise/asdf/pyenv for canonical Devtool execution.
# mise.toml remains a developer convenience surface, not an execution authority.
manager = "none"

[bootstrap]
# G2 executes the Android authority natively in Termux. Reuse the canonical
# Devtool bootstrap/cache and provision only missing components; do not let the
# presence of chrootctl silently turn this target into discovery-only chroot mode.
downloads = "missing"
network = "allow"
fail_on_missing_tools = true

[targets.mmrl_android]
root = "."
execution_environment = "native-termux"
chroot_name = "androidos"
runner = "android"
platform = "android"

[targets.mmrl_android.android]
system_deps = "auto"
native_provider = "ndk"
ndk_version = "29.0.14206865"
ndk_host_provider = "auto"
cmake_version = "3.22.1"
variant = "officialDebug"
aapt2_provider = "termux"
prefer_native_termux = true

# X02/G2 make Devtool's AOPS02/AOPS03 device fabric authoritative. Full AOPS04
# release requires instrumentation and install smoke against one admitted device;
# package-only callers must explicitly disable the device gates.
[targets.mmrl_android.android.adb]
provider = "auto"
device_policy = "exactly-one"

[targets.mmrl_android.android.instrumentation]
policy = "required"
variant = "officialDebug"
module = "app"
keep_installed = false
capture_logcat_on_failure = true
capture_screenshot_on_failure = true

# MMRL continues to own signing.properties and never moves password values into
# Devtool configuration. Devtool owns release-signing policy, artifact signature
# verification, signer-identity evidence, and fail-closed release qualification.
[targets.mmrl_android.android.signing.release]
mode = "project"
policy = "release-required"

[targets.mmrl_android.android.release]
variant = "officialRelease"
module = "app"
unit_tests = true
lint = true
device_tests = "required"
install_smoke = true
upgrade_smoke = true
verify_signature = true
verify_certificate_identity = true
package = "com.mikeyphw.mmrl"
activity = "com.dergoogler.mmrl.ui.activity.MainActivity"
keep_installed = true

[targets.mmrl_android.android.variants.officialDebug]
build_type = "debug"
flavor = "official"
signing = "debug"
deployable = true
release_gates = false
module = "app"

[targets.mmrl_android.android.variants.officialRelease]
build_type = "release"
flavor = "official"
signing = "release"
signing_profile = "release"
deployable = true
release_gates = true
module = "app"

[targets.mmrl_android.gradle]
version = "9.7.1"
provider = "wrapper"
resource_profile = "constrained"
max_workers = 1
heap_mb = 768
validation_packaging_heap_mb = 768
configuration_cache = "off"
telemetry_level = "standard"
no_daemon = true
vfs = false
parallel = false
build_cache = true
failure_policy = "collect"
daemon_idle_timeout_ms = 900000

[targets.mmrl_android.tasks]
restore = ["help"]
build = [":app:assembleOfficialDebug"]
test = [
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
]
lint = [":app:lintOfficialDebug"]
clean = ["clean"]
# AOPS04 activates this independent release lane instead of reusing the target's
# ordinary OfficialDebug task bindings. Variant-bound tasks therefore remain
# truthful to the release/instrumentation lane identities.
release_test = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
  ":platform:testNativeContracts",
  ":app:testOfficialReleaseUnitTest",
]
release_lint = [":app:fullLintOfficialRelease"]
release_build = [":app:assembleOfficialRelease"]
release_instrumentation = [":app:connectedOfficialDebugAndroidTest"]
instrumentation = [":app:connectedOfficialDebugAndroidTest"]

[targets.mmrl_android.artifacts]
required = true

# X01 establishes repository-owned EXO target-local jobs. Read-only contract
# checks explicitly say so; Gradle/device jobs declare bounded write scopes so
# the scheduler no longer has to treat every workflow node as an unknown writer.
[targets.mmrl_android.jobs.source-hygiene]
runner = "command"
command = ["python3", "scripts/validate-mmrl-source-hygiene.py"]
inputs = ["**/*"]
metadata = { read_only = true, resource_class = "generic-read-only", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.static-gates]
runner = "gradle"
gradle_tasks = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
]
inputs = [".devtool.toml", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**", "scripts/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.unit-contracts]
runner = "gradle"
gradle_tasks = [
  ":platform:testNativeContracts",
  ":platform:testDebugUnitTest",
  ":app:testOfficialDebugUnitTest",
]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.compile-contracts]
runner = "gradle"
gradle_tasks = [
  ":app:compileOfficialDebugSources",
  ":app:processOfficialDebugResources",
  ":app:compileOfficialDebugAndroidTestKotlin",
]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.strict-lint]
runner = "gradle"
gradle_tasks = [":app:fullLintOfficialDebug"]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

[targets.mmrl_android.jobs.strict-lint.env]
"ORG_GRADLE_PROJECT_mmrl.fullLint" = "true"

[targets.mmrl_android.jobs.package-seal]
runner = "gradle"
gradle_tasks = [
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
inputs = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "gradle-heavy", roadmap_id = "MMRL-DT-X01" }

# Native device boundary. `action = "instrumentation"` lowers through the
# canonical AndroidGradleRunner and AndroidInstrumentationOrchestrator: Gradle
# build ownership stays with Devtool, then the AOPS02 device manager installs,
# runs, captures failure evidence, and cleans up according to policy.
[targets.mmrl_android.jobs.device-native]
runner = "android"
action = "instrumentation"
inputs = [".devtool.toml", "settings.gradle.kts", "build.gradle.kts", "gradle.properties", "gradle/**", "build-logic/**", "app/**", "platform/**", "ui/**", "datastore/**", "ext/**", "hidden-api/**", "terminal-compat/**", "webui-core-compat/**", "compat/**"]
outputs = [".gradle/**", ".kotlin/**", ".devtool/reports/**", "build/**", "build-logic/build/**", "app/build/**", "platform/build/**", "ui/build/**", "datastore/build/**", "ext/build/**", "hidden-api/build/**", "terminal-compat/build/**", "webui-core-compat/build/**", "compat/build/**"]
metadata = { resource_class = "device-exclusive", global_reservations = ["mmrl-adb-device"], roadmap_id = "MMRL-DT-X02", device_authority = "devtool-aops02-aops03" }

[targets.mmrl_android.workflows]
repository-check = [
  { id = "source-hygiene", ref = "job:source-hygiene", depends_on = [] },
  { id = "static-gates", ref = "job:static-gates", depends_on = ["source-hygiene"] },
  { id = "unit-contracts", ref = "job:unit-contracts", depends_on = ["static-gates"] },
  { id = "compile-contracts", ref = "job:compile-contracts", depends_on = ["static-gates"] },
  { id = "strict-lint", ref = "job:strict-lint", depends_on = ["unit-contracts", "compile-contracts"] },
  { id = "package-seal", ref = "job:package-seal", depends_on = ["strict-lint"] },
]
device = [
  { id = "device-native", ref = "job:device-native", depends_on = [] },
]
release-check = [
  { id = "source-hygiene", ref = "job:source-hygiene", depends_on = [] },
  { id = "static-gates", ref = "job:static-gates", depends_on = ["source-hygiene"] },
  { id = "unit-contracts", ref = "job:unit-contracts", depends_on = ["static-gates"] },
  { id = "compile-contracts", ref = "job:compile-contracts", depends_on = ["static-gates"] },
  { id = "strict-lint", ref = "job:strict-lint", depends_on = ["unit-contracts", "compile-contracts"] },
  { id = "package-seal", ref = "job:package-seal", depends_on = ["strict-lint"] },
  { id = "device-native", ref = "job:device-native", depends_on = ["package-seal"] },
]
ci-preflight = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
  { id = "source-hygiene", ref = "job:source-hygiene", depends_on = [] },
]
ci-source = [
  { id = "actions-contract", ref = "job:ci-actions-contract", depends_on = [] },
  { id = "source-contract", ref = "job:ci-source-contract", depends_on = ["actions-contract"] },
]

[validation.phases]
dependencies = false
instrumentation = false
finalize = true
preflight = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
  "help",
]
compile = [
  ":app:compileOfficialDebugSources",
  ":app:compileOfficialDebugAndroidTestKotlin",
]
resources = [":app:processOfficialDebugResources"]
unit-test = [
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
]
package = [
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
lint = [":app:fullLintOfficialDebug"]

[validation.final]
release-seal = [
  "verifyStableToolchainBaseline",
  "verifyMmrlProductBoundary",
  "verifyRepositoryHygiene",
  ":platform:testDebugUnitTest",
  ":platform:testNativeContracts",
  ":app:testOfficialDebugUnitTest",
  ":app:fullLintOfficialDebug",
  ":app:compileOfficialDebugAndroidTestKotlin",
  ":app:assembleOfficialDebug",
  ":app:assembleOfficialRelease",
  ":app:verifyReleaseArtifacts",
]
native = [":platform:testDebugUnitTest", ":platform:testNativeContracts"]

